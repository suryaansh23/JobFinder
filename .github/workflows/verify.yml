name: Verify JobFinder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "suryansh-*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test tracker record identity and legacy migration
        run: node scripts/test-tracker-record-ids.mjs
      - name: Verify actionable queue routing
        run: node scripts/test-actionable-queue.mjs
      - name: Test safe LinkedIn apply fallbacks
        run: node scripts/test-linkedin-apply-url.mjs
      - name: Regression-test unattended AUTOPILOT gate
        run: node scripts/test-autopilot.mjs
      - name: Verify unlimited AUTOPILOT quota opt-in
        run: node scripts/test-application-quota.mjs
      - name: Production build
        run: npm run build
