name: Verify JobFinder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "suryansh-*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify patched Next.js
        run: node -e "const v=require('next/package.json').version;if(v!=='15.5.25'){throw new Error('Unexpected Next.js '+v)}"
      - name: Production build
        run: npm run build
