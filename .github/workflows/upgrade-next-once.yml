name: One-time Next Security Upgrade

on:
  push:
    branches: [suryansh-phase3-windows-production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message || '', 'security: upgrade Next.js to 15.5.25') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suryansh-phase3-windows-production
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Resolve patched Next.js and lockfile
        run: npm install next@15.5.25 --save-exact --ignore-scripts
      - name: Commit resolved dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Already upgraded.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: upgrade Next.js to 15.5.25'
          git push origin HEAD:suryansh-phase3-windows-production
